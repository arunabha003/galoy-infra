#@ def aws_bump_repos_job():
name: #@ bump_repos_job_name("aws")
plan:
- in_parallel:
  - get: every-1h
    trigger: true
  - get: #@ modules_resource_name("aws")
  - get: repo
  - get: pipeline-tasks
- task: bump-repos
  config:
    platform: linux
    image_resource: #@ task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    - name: #@ modules_resource_name("aws")
      path: modules
    outputs:
    - name: repo
    params:
      BRANCH: #@ data.values.git_branch
      AWS_ACCESS_KEY_ID: #@ data.values.testflight_aws_access_key_id
      AWS_SECRET_ACCESS_KEY: #@ data.values.testflight_aws_secret_access_key
    run:
      path: pipeline-tasks/ci/tasks/aws/bump-repos.sh
- put: repo
  params:
    repository: repo
    rebase: true
#@ end

#@ def aws_build_pipeline_image_job():
name: #@ build_pipeline_image_job_name("aws")
plan:
- in_parallel:
  - get: repo
    trigger: true
  - get: pipeline-tasks
- task: build
  privileged: true
  config:
    platform: linux
    image_resource:
      type: registry-image
      source:
        repository: concourse/oci-build-task
    inputs:
    - name: repo
    - name: pipeline-tasks
    outputs:
    - name: image
    params:
      CONTEXT: pipeline-tasks/ci/image/aws
    run:
      path: build
- put: aws-pipeline-image
  params:
    image: image/image.tar
#@ end

