#@ def task_image_config():
type: registry-image
source:
  username: #@ data.values.gar_registry_user
  password: #@ data.values.gar_registry_password
  repository: #@ pipeline_image()
#@ end

#@ def aws_modules():
name: #@ modules_resource_name("aws")
type: git
webhook_token: ((webhook.secret))
source:
  paths:
  - modules/bootstrap/aws
  - modules/inception/aws
  - modules/platform/aws
  - modules/postgresql/aws
  - modules/smoketest
  uri: #@ data.values.git_uri
  branch: #@ data.values.git_branch
  private_key: #@ data.values.github_private_key
#@ end

#@ def aws_testflight_task_params():
AWS_ACCESS_KEY_ID: #@ data.values.testflight_aws_access_key_id
AWS_SECRET_ACCESS_KEY: #@ data.values.testflight_aws_secret_access_key
AWS_DEFAULT_REGION: #@ data.values.testflight_aws_region
TESTFLIGHT_ADMINS: #@ data.values.testflight_aws_admins
KUBE_HOST: #@ data.values.concourse_tf_kube_host
KUBE_CA_CERT: #@ data.values.concourse_tf_kube_ca_cert
KUBE_TOKEN: #@ data.values.concourse_tf_kube_token
BRANCH: #@ data.values.git_branch
#@ end

#@ def aws_testflight_bootstrap_job():
name: #@ testflight_bootstrap_job_name("aws")
serial: true
plan:
- put: aws-testflight-lock
  params: { claim: aws-testflight }
- in_parallel:
  - get: #@ modules_resource_name("aws")
    trigger: true
  - { get: repo }
  - { get: pipeline-tasks }
  - { get: aws-testflight-uid }
- task: bootstrap
  attempts: 4
  config:
    platform: linux
    image_resource: #@ task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    - name: #@ modules_resource_name("aws")
      path: modules
    - name: aws-testflight-uid
      path: testflight-uid
    params: #@ aws_testflight_task_params()
    run:
      path: pipeline-tasks/ci/tasks/aws/bootstrap.sh
#@ end

#@ def aws_testflight_inception_job():
name: #@ testflight_inception_job_name("aws")
serial: true
plan:
- get: aws-testflight-lock
  passed:
  - #@ testflight_bootstrap_job_name("aws")
- in_parallel:
  - get: #@ modules_resource_name("aws")
    trigger: true
    passed:
    - #@ testflight_bootstrap_job_name("aws")
  - get: repo
    passed:
    - #@ testflight_bootstrap_job_name("aws")
  - { get: pipeline-tasks }
  - get: aws-testflight-uid
    passed:
    - #@ testflight_bootstrap_job_name("aws")
- task: inception
  attempts: 4
  config:
    platform: linux
    image_resource: #@ task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    - name: #@ modules_resource_name("aws")
      path: modules
    - name: aws-testflight-uid
      path: testflight-uid
    params: #@ aws_testflight_task_params()
    run:
      path: pipeline-tasks/ci/tasks/aws/inception.sh
#@ end

