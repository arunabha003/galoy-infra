#@ def aws_testflight_cleanup_job():
name: #@ testflight_cleanup_job_name("aws")
serial: true
plan:
- get: aws-testflight-lock
  passed:
  - #@ testflight_smoketest_job_name("aws")
- in_parallel:
  - get: #@ modules_resource_name("aws")
    trigger: true
    passed:
    - #@ testflight_smoketest_job_name("aws")
  - get: repo
    passed:
    - #@ testflight_smoketest_job_name("aws")
  - { get: pipeline-tasks }
  - get: aws-testflight-uid
    passed:
    - #@ testflight_smoketest_job_name("aws")
- task: teardown
  config:
    platform: linux
    image_resource: #@ task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    - name: #@ modules_resource_name("aws")
      path: modules
    - name: aws-testflight-uid
      path: testflight-uid
    params: #@ aws_testflight_task_params()
    run:
      path: pipeline-tasks/ci/tasks/aws/teardown.sh
  ensure:
    put: aws-testflight-lock
    params: { release: aws-testflight }
#@ end

